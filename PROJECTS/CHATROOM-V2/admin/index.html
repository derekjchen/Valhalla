<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatroom V2 - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        
        /* Login Page */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .login-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-box h1 {
            font-size: 24px;
            color: #f8fafc;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .login-box .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            border-color: #3b82f6;
        }
        
        .btn {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn:hover {
            background: #2563eb;
        }
        
        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        
        .error-msg {
            color: #ef4444;
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
        }
        
        /* Dashboard */
        .dashboard {
            display: none;
        }
        
        .dashboard.active {
            display: block;
        }
        
        .login-container.hidden {
            display: none;
        }
        
        .header {
            background: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 18px;
            color: #f8fafc;
        }
        
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header .user-name {
            color: #94a3b8;
            font-size: 14px;
        }
        
        .btn-logout {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-logout:hover {
            border-color: #ef4444;
            color: #ef4444;
        }
        
        .main-content {
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid #334155;
            padding-bottom: 16px;
        }
        
        .tab {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }
        
        .tab.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        
        .panel {
            display: none;
        }
        
        .panel.active {
            display: block;
        }
        
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .card-title {
            font-size: 16px;
            color: #f8fafc;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            width: auto;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        /* Table */
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        
        th {
            color: #94a3b8;
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
        }
        
        td {
            color: #e2e8f0;
            font-size: 14px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-online {
            background: #166534;
            color: #bbf7d0;
        }
        
        .status-offline {
            background: #374151;
            color: #9ca3af;
        }
        
        .btn-icon {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
            width: auto;
        }
        
        .btn-icon:hover {
            background: #334155;
            color: #f8fafc;
        }
        
        .btn-icon.delete:hover {
            color: #ef4444;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }
        
        .stat-label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #f8fafc;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.hidden {
            display: none;
        }
        
        .modal {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-title {
            font-size: 18px;
            color: #f8fafc;
        }
        
        .btn-close {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 20px;
            cursor: pointer;
            width: auto;
            padding: 4px;
        }
        
        .btn-close:hover {
            color: #f8fafc;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            width: auto;
            flex: 1;
        }
        
        .btn-secondary:hover {
            border-color: #64748b;
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-box">
            <h1>🦞 Chatroom V2</h1>
            <p class="subtitle">Admin Dashboard</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="btn" id="loginBtn">Sign In</button>
                
                <p class="error-msg" id="loginError"></p>
            </form>
        </div>
    </div>
    
    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>🦞 Chatroom V2 Admin</h1>
            <div class="user-info">
                <span class="user-name" id="currentUser"></span>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-value" id="statUsers">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Online Users</div>
                    <div class="stat-value" id="statOnline">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Registered Agents</div>
                    <div class="stat-value" id="statAgents">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Messages Today</div>
                    <div class="stat-value" id="statMessages">0</div>
                </div>
            </div>
            
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="users">Users</button>
                <button class="tab" data-tab="agents">Agents</button>
                <button class="tab" data-tab="settings">Settings</button>
            </div>
            
            <!-- Users Panel -->
            <div class="panel active" id="usersPanel">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Users</h3>
                        <button class="btn-primary" id="addUserBtn">+ Add User</button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Status</th>
                                    <th>Last Active</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTable">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Agents Panel -->
            <div class="panel" id="agentsPanel">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Registered Agents</h3>
                        <button class="btn-primary" id="refreshAgentsBtn">↻ Refresh</button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Agent ID</th>
                                    <th>Name</th>
                                    <th>Registered</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="agentsTable">
                                <!-- Dynamic content -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Settings Panel -->
            <div class="panel" id="settingsPanel">
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Webhook Settings</h3>
                    </div>
                    <div class="form-group">
                        <label for="webhookUrl">Webhook URL</label>
                        <input type="text" id="webhookUrl" placeholder="http://gateway:18789/trigger">
                    </div>
                    <div class="form-group">
                        <label for="webhookAgents">Trigger Agents (comma-separated)</label>
                        <input type="text" id="webhookAgents" placeholder="co, claw">
                    </div>
                    <button class="btn-primary" id="saveSettingsBtn">Save Settings</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add User Modal -->
    <div class="modal-overlay hidden" id="addUserModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Add User</h3>
                <button class="btn-close" id="closeModal">&times;</button>
            </div>
            <form id="addUserForm">
                <div class="form-group">
                    <label for="newUsername">Username</label>
                    <input type="text" id="newUsername" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">Password</label>
                    <input type="password" id="newPassword" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" id="cancelAddUser">Cancel</button>
                    <button type="submit" class="btn">Add User</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
